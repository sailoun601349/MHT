{% extends "base.html" %}
{% block title %}修改登录密码{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-5">
    <div class="card shadow-sm auth-card">
      <div class="card-body p-4">
        <h5 class="auth-title">🔑 修改登录密码</h5>
        {% if current_user.must_change_password %}
        <div class="alert alert-warning small">首次登录，请先设置新登录密码</div>
        {% endif %}
        <form method="post" action="{{ url_for('admin.change_password') }}">
          <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
          {% if not current_user.must_change_password %}
          <div class="mb-3">
            <label class="form-label">当前登录密码</label>
            <input type="password" class="form-control" name="current_password" required>
          </div>
          {% endif %}
          <div class="mb-3">
            <label class="form-label">新登录密码</label>
            <input type="password" class="form-control" name="new_password" required minlength="6" placeholder="至少 6 位">
          </div>
          <div class="mb-4">
            <label class="form-label">确认新登录密码</label>
            <input type="password" class="form-control" name="confirm_password" required minlength="6">
          </div>
          <button class="btn btn-primary btn-lg w-100">确认修改</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
