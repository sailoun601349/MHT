{% extends "base.html" %}
{% block title %}管理员登录{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-5">
    <div class="card shadow-sm auth-card">
      <div class="card-body p-4">
        <h5 class="auth-title">🔐 管理员登录</h5>
        <form method="post" action="{{ url_for('admin.login') }}">
          <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label">管理员手机号</label>
            <input type="tel" class="form-control form-control-lg" name="phone"
                   required inputmode="numeric" maxlength="11" autofocus>
          </div>
          <div class="mb-4">
            <label class="form-label">登录密码</label>
            <input type="password" class="form-control form-control-lg" name="code" required>
          </div>
          <button class="btn btn-primary btn-lg w-100">登录</button>
        </form>
        <p class="text-center mt-3 mb-0">
          <a href="{{ url_for('main.index') }}" class="small text-muted text-decoration-none">返回首页</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
