{% extends "base.html" %}
{% block title %}首页 - 猕猴桃订购{% endblock %}
{% block body_class %}home-page{% endblock %}
{% block content %}

<!-- ===== 品牌 Hero（渐变 + 柔光斑 + 吉祥物 + 品牌语）===== -->
<section class="home-hero" aria-label="猕猴桃订购品牌区">
  <div class="hero-glow hero-glow--a" aria-hidden="true"></div>
  <div class="hero-glow hero-glow--b" aria-hidden="true"></div>

  <div class="mascot mascot--float" data-state="normal" aria-hidden="true">
    <svg class="mascot-svg mascot--breathe" viewBox="0 0 120 130" role="presentation">
      <!-- 身体（共用）：外皮盘底 → 果肉环 → 8 颗籽 → 果芯脸盘 -->
      <g class="mascot-body">
        <circle cx="60" cy="58" r="50" fill="#8B5E3C"/>
        <circle cx="60" cy="58" r="43" fill="#97C459"/>
        <g fill="#3A3A3A">
          <circle cx="96" cy="58" r="2.4"/><circle cx="85.5" cy="83.5" r="2.4"/>
          <circle cx="60" cy="94" r="2.4"/><circle cx="34.5" cy="83.5" r="2.4"/>
          <circle cx="24" cy="58" r="2.4"/><circle cx="34.5" cy="32.5" r="2.4"/>
          <circle cx="60" cy="22" r="2.4"/><circle cx="85.5" cy="32.5" r="2.4"/>
        </g>
        <circle cx="60" cy="58" r="29" fill="#F6EFD8"/>
      </g>
      <!-- 两片叶（深/浅绿） -->
      <ellipse cx="46" cy="9" rx="12" ry="6" fill="#639922" transform="rotate(-26 46 9)"/>
      <ellipse cx="74" cy="9" rx="12" ry="6" fill="#97C459" transform="rotate(26 74 9)"/>
      <!-- 腮红（常显） -->
      <g fill="#F0997B" opacity=".5">
        <ellipse cx="42" cy="65" rx="5.5" ry="4"/>
        <ellipse cx="78" cy="65" rx="5.5" ry="4"/>
      </g>
      <!-- 四组表情态（CSS 按 data-state 显隐） -->
      <g class="face face-normal">
        <circle cx="50" cy="54" r="3.4" fill="#2C2C2A"/>
        <circle cx="70" cy="54" r="3.4" fill="#2C2C2A"/>
        <path d="M52 65 Q60 71 68 65" stroke="#2C2C2A" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      </g>
      <g class="face face-blink">
        <circle cx="50" cy="54" r="3.4" fill="#2C2C2A"/>
        <path d="M66.5 53.5 Q70 51 73.5 53.5" stroke="#2C2C2A" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        <path d="M52 65 Q60 71 68 65" stroke="#2C2C2A" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      </g>
      <g class="face face-happy">
        <path d="M46.5 55 Q50 51.5 53.5 55" stroke="#2C2C2A" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        <path d="M66.5 55 Q70 51.5 73.5 55" stroke="#2C2C2A" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        <path d="M53.5 66 A6.5 6.5 0 0 0 66.5 66 Z" fill="#2C2C2A"/>
      </g>
      <g class="face face-focus">
        <circle cx="50" cy="56" r="3" fill="#2C2C2A"/>
        <circle cx="70" cy="56" r="3" fill="#2C2C2A"/>
        <path d="M54 67 H66" stroke="#2C2C2A" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      </g>
    </svg>
  </div>

  <h1 class="hero-title">猕猴桃订购</h1>
  <span class="hero-chip">太白山 · 产地直发</span>
</section>

<!-- ===== 毛玻璃下单卡片（上浮重叠 Hero 底部）===== -->
<div class="home-wrap">
  <section class="glass-card" aria-label="下单入口">
    <form method="post" action="{{ url_for('main.enter') }}">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label" for="phone-input">手机号</label>
        <input type="tel" class="form-control form-control-lg" id="phone-input" name="phone"
               inputmode="numeric" maxlength="11" pattern="1[3-9][0-9]{9}"
               placeholder="请输入 11 位手机号" required autofocus>
        <div class="form-text">仅用手机号即可下单；填查询码可查询已有订单</div>
      </div>
      <div class="mb-4">
        <label class="form-label" for="code-input">查询码（选填）</label>
        <input type="text" class="form-control form-control-lg" id="code-input" name="code"
               inputmode="numeric" maxlength="6" pattern="[0-9]{3,6}"
               placeholder="如 001">
      </div>
      <button class="btn btn-primary btn-lg w-100">进入下单</button>
    </form>
    <p class="text-center mt-3 mb-0">
      <a href="{{ url_for('admin.login') }}" class="small text-muted text-decoration-none">管理员入口</a>
    </p>
  </section>
</div>
{% endblock %}
