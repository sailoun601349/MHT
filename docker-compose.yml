services:
  kivi-order:
    build: .
    container_name: kivi-order
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # 凭据一律从根目录 .env 读取（不入库）；未设置时 docker compose 直接报错
      SECRET_KEY: ${SECRET_KEY:?请在 .env 中设置 SECRET_KEY}
      ADMIN_PHONE: ${ADMIN_PHONE:?请在 .env 中设置 ADMIN_PHONE}
      ADMIN_CODE: ${ADMIN_CODE:?请在 .env 中设置 ADMIN_CODE}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./logs:/app/logs
